services:
  db:
    image: postgres:16-alpine
    container_name: keep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keep_user
      POSTGRES_PASSWORD: keep_password
      POSTGRES_DB: keep_db
    ports:
      - "5432:5432"
    volumes:
      - keep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keep_user -d keep_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  keep_pg_data:
